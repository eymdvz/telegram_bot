name: solat-trial-tick
on:
  schedule:
    - cron: '*/10 * * * *' # every 10 min — posts due prayer reminders only
  workflow_dispatch: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot/TESTING-ROBOT-@justfortesting_tgbot/tgcloud-serverless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/TESTING-ROBOT-@justfortesting_tgbot/tgcloud-serverless/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tgcloud run endpoints/cronTick '{}'
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
