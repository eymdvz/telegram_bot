name: solat-trial-daily
on:
  schedule:
    - cron: '45 20 * * *' # 04:45 Asia/Singapore — day card
  workflow_dispatch: {}
jobs:
  daily:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot/TESTING-ROBOT-@justfortesting_tgbot/tgcloud-serverless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/TESTING-ROBOT-@justfortesting_tgbot/tgcloud-serverless/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tgcloud run endpoints/cronDaily '{}'
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
